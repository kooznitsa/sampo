x-app-main:
  &app-main
  networks:
    - sampo-net

services:
  backend:
    <<: *app-main
    build:
      context: ../
      target: dev
      dockerfile: deploy/Dockerfile
    hostname: backend
    container_name: ${APP_NAME}_backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - ../env/.env.${ENV}
    command: >
      /bin/bash -c "poetry install --no-root --no-interaction
      && poetry run python manage.py migrate --noinput
      && poetry run python manage.py collectstatic --noinput
      && poetry run gunicorn core.wsgi --reload --bind=0.0.0.0:8000 --workers=1 --log-level=$${LOG_LEVEL}"
    ports:
      - '8888:8000'
    volumes:
      - ../:/home/app
      - static-volume:/home/app/staticfiles
    profiles: [main, secondary]

  postgres:
    <<: *app-main
    image: postgres:16
    shm_size: '1gb'
    hostname: postgres
    container_name: ${APP_NAME}_postgres
    restart: on-failure
    ports:
      - '${POSTGRES_EXTERNAL_PORT}:5432'
    env_file:
      - ../env/.env.${ENV}
    volumes:
      - db-postgres:/var/lib/postgresql/data
      - ../scripts/create_databases.sql:/docker-entrypoint-initdb.d/create_databases.sql
    profiles: [main, secondary]

  test_postgres:
    <<: *app-main
    image: postgres:16
    shm_size: '1gb'
    hostname: test_postgres
    container_name: ${APP_NAME}_test_postgres
    restart: on-failure
    environment:
      POSTGRES_DB: ${APP_NAME}_database
      POSTGRES_USER: ${APP_NAME}_user
      POSTGRES_PASSWORD: ${APP_NAME}_password
      POSTGRES_PORT: 5434
      POSTGRES_HOST: test_postgres
    ports:
      - '${POSTGRES_TEST_EXTERNAL_PORT}:5434'
    volumes:
      - test-postgres:/var/lib/postgresql/data
      - ../scripts/create_databases.sql:/docker-entrypoint-initdb.d/create_databases.sql
    profiles: [main, secondary]

  nginx:
    <<: *app-main
    image: nginx:1.25
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static-volume:/home/static
    container_name: ${APP_NAME}_nginx
    restart: on-failure
    ports:
      - '1337:80'
    depends_on:
      - backend
    profiles: [main]

volumes:
  static-volume:
  db-postgres:
  test-postgres:

networks:
  sampo-net:
    name: sampo-net
