x-app-main:
  &app-main
  networks:
    - sampo-net

services:
  backend:
    <<: *app-main
    build:
      context: ../
      target: ${BUILD_TARGET:-dev}
      dockerfile: deploy/Dockerfile
    hostname: backend
    container_name: ${APP_NAME}_backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - ../env/.env.${ENV}
    command: >
      /bin/bash -c "poetry install --no-root --no-interaction
      && poetry run python manage.py migrate --noinput
      && poetry run python manage.py collectstatic --noinput
      && poetry run gunicorn core.wsgi --reload --bind=0.0.0.0:8000 --workers=1 --log-level=$${LOG_LEVEL}"
    ports:
      - '8888:8000'
    volumes:
      - ../:/home/app
      - static-volume:/home/app/staticfiles
    profiles: [main, secondary, test]

  postgres:
    <<: *app-main
    image: postgres:16
    shm_size: '1gb'
    hostname: postgres
    container_name: ${APP_NAME}_postgres
    restart: on-failure
    ports:
      - '${POSTGRES_EXTERNAL_PORT}:5432'
    env_file:
      - ../env/.env.${ENV}
    volumes:
      - db-postgres:/var/lib/postgresql/data
      - ../scripts/create_databases.sql:/docker-entrypoint-initdb.d/create_databases.sql
    profiles: [main, secondary, test]

  test_postgres:
    <<: *app-main
    image: postgres:16
    shm_size: '1gb'
    hostname: test_postgres
    container_name: ${APP_NAME}_test_postgres
    restart: on-failure
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB}
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: test_postgres
    ports:
      - '${POSTGRES_TEST_EXTERNAL_PORT}:5432'
    volumes:
      - test-postgres:/var/lib/postgresql/data
      - ../scripts/create_databases.sql:/docker-entrypoint-initdb.d/create_databases.sql
    profiles: [main, secondary, test]

  elasticsearch:
    <<: *app-main
    image: elasticsearch:8.16.3
    container_name: ${APP_NAME}_elasticsearch
    restart: always
    environment:
      - bootstrap.memory_lock=true
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      - discovery.type=single-node
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch
    profiles: [main]

  nginx:
    <<: *app-main
    image: nginx:1.25
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static-volume:/home/static
    container_name: ${APP_NAME}_nginx
    restart: on-failure
    ports:
      - '1337:80'
    depends_on:
      - backend
    profiles: [main]

  chrome:
    <<: *app-main
    image: selenium/node-chrome:beta
    container_name: ${APP_NAME}_chrome
    restart: always
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub

  selenium-hub:
    <<: *app-main
    image: selenium/hub:latest
    container_name: ${APP_NAME}_selenium-hub
    restart: always
    ports:
      - '4442:4442'
      - '4443:4443'
      - '4444:4444'

  redis:
    <<: *app-main
    image: redis:7
    container_name: ${APP_NAME}_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis:/data

  celery:
    <<: *app-main
    build:
      context: ../
      target: dev
      dockerfile: deploy/Dockerfile
    command: poetry run celery -A core worker -l info
    container_name: ${APP_NAME}_celery
    restart: always
    depends_on:
      - postgres
      - backend
      - redis
      - selenium-hub
      - chrome
    env_file:
      - ../env/.env.${ENV}
    volumes:
      - ../:/home/app

  flower:
    <<: *app-main
    build:
      context: ../
      target: dev
      dockerfile: deploy/Dockerfile
    container_name: ${APP_NAME}_flower
    restart: always
    command: poetry run celery -A core flower
    depends_on:
      - redis
      - celery
    ports:
      - '5555:5555'
    env_file:
      - ../env/.env.${ENV}
    volumes:
      - ../:/home/app

volumes:
  static-volume:
  db-postgres:
  test-postgres:
  redis:
  elasticsearch-data:

networks:
  sampo-net:
    name: sampo-net
