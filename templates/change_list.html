{% extends "admin/change_list.html" %}

{% block result_list %}
    <div id="top-scroll" style="overflow-x: auto; overflow-y: hidden; height: 20px; margin-bottom: 5px;">
        <div id="top-scroll-inner" style="height: 1px;"></div>
    </div>
    {{ block.super }}
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <style>
        #result_list {
            display: block;
            overflow-x: auto;
            white-space: nowrap;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const bottom = document.getElementById('result_list');
            const top = document.getElementById('top-scroll');
            const topInner = document.getElementById('top-scroll-inner');

            function syncScroll(source, target) {
                source.addEventListener('scroll', () => {
                    target.scrollLeft = source.scrollLeft;
                });
            }

            if (bottom && top && topInner) {
                setTimeout(() => {
                    topInner.style.width = bottom.scrollWidth + 'px';
                    syncScroll(top, bottom);
                    syncScroll(bottom, top);
                }, 100);
            }
        });
    </script>
{% endblock %}
