name: CI

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: cp env/.env.example env/.env.local

      - name: Install make
        run: |
          sudo apt-get update
          sudo apt-get -y install make

      - name: Run containers
        run: make build

      - name: Run linter (inside Docker)
        run: make linter

      # --- Separate step for mypy ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --only main,dev

      - name: Run mypy (outside Docker)
        run: make mypyapp-ci APP=restaurant
