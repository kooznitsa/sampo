name: CI

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: cp env/.env.example env/.env.local

      - name: Install make
        run: |
          sudo apt-get update
          sudo apt-get -y install make

      - name: Run containers
        run: make build

      - name: Run linter
        run: make linter

      - name: Check typing
        run: make mypy
